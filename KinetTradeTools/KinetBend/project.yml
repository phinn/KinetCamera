name: KinetBend
options:
  bundleIdPrefix: com.kinetai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  KitCore:
    path: ../KitCore

targets:
  KinetBend:
    type: application
    platform: iOS
    sources:
      - path: KinetBend
    dependencies:
      - package: KitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinetai.kinetbend
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: KinetBend/Info.plist
        DEVELOPMENT_TEAM: M92UKS6NA2
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.9
        ENABLE_PREVIEWS: true
        SUPPORTS_MACCATALYST: false
    info:
      path: KinetBend/Info.plist
      properties: {}

schemes:
  KinetBend:
    build:
      targets:
        KinetBend: all
    run:
      config: Debug
