name: KinetCamera
options:
  bundleIdPrefix: com.kinet
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  KinetCamera:
    type: application
    platform: macOS
    sources:
      - path: KinetCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinet.KinetCamera
        PRODUCT_NAME: KinetCamera
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KinetCamera/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_USER_SCRIPT_SANDBOXING: NO
