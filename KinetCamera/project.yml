name: KinetCamera
options:
  bundleIdPrefix: com.kinet
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: M92UKS6NA2
    CODE_SIGN_STYLE: Automatic

targets:
  KinetCamera:
    type: application
    platform: macOS
    sources:
      - path: KinetCamera
        excludes:
          - "Assets.xcassets"               # macOS 用 iconset(Xcode 自动转 icns),xcassets 归 iOS
          # 注意:AppIcon.iconset 必须保留在 macOS sources(Xcode 转成 AppIcon.icns 进 bundle),
          # 只在 iOS target excludes——iOS 曾被塞 1.5MB icns,是 iPhone 存储堵点之一
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinet.KinetCamera
        PRODUCT_NAME: KinetCamera
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        # 固定开发证书(非 ad-hoc "-"):ad-hoc 每次构建 CDHash 变化,
        # TCC 视为新 app 反复弹相机权限;固定证书后授权一次永久生效
        CODE_SIGN_IDENTITY: "Apple Development"
        "CODE_SIGN_INJECT_BASE_ENTITLEMENTS": YES
        # Hardened Runtime 下 tccd 要求 entitlement com.apple.security.device.camera,
        # 缺失时 Policy disallows prompt 静默拒绝(连弹框都不出),必须显式声明
        CODE_SIGN_ENTITLEMENTS: KinetCamera/KinetCamera.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KinetCamera/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  KinetCameraiOS:
    type: application
    platform: iOS
    sources:
      - path: KinetCamera
        excludes:
          - "Info.plist"                    # macOS 版 plist,防 Multiple commands produce
          - "Resources"                     # icns 归 macOS
          - "AppIcon.iconset"               # iconset 源目录禁止进 Resources(1.5MB AppIcon.icns 混入根因,iPhone 存储堵点之一)
      - path: KinetCamera/Assets.xcassets   # iOS 图标(appiconset 单 1024)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinet.KinetCamera.iOS
        PRODUCT_NAME: KinetCamera
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KinetCameraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KinetCameraTests
    dependencies:
      - target: KinetCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinet.KinetCameraTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"

  KinetCameraiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KinetCameraTests
    dependencies:
      - target: KinetCameraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinet.KinetCameraTests.iOS
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        # iOS app 的 PRODUCT_NAME=KinetCamera(与 macOS 同名),TEST_HOST 必须指向实际 app 产物
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KinetCamera.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KinetCamera"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  KinetCameraiOS:
    build:
      targets:
        KinetCameraiOS: all
    test:
      gatherCoverageData: false
      targets:
        - KinetCameraiOSTests
